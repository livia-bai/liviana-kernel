# 每次推送到 main（以及手动触发、PR）时：格式检查、文档链接检查、四种优化模式的 QEMU 自动测试。
# 本地验证的方法相同，见 docs/testing.md。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZIG_VERSION: 0.17.0
      # https://ziglang.org/download/index.json 里 0.17.0 / x86_64-linux 的 shasum
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        # qemu-system-data（qemu-system-misc 的依赖）里带着 -bios default 用的 OpenSBI 固件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc
          qemu-system-riscv64 --version

      - name: Install Zig
        run: |
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          zig version
          python3 --version

      - name: Check formatting
        run: zig fmt --check build.zig src/ user/

      - name: Check documentation links
        run: python3 tools/check_links.py

      - name: QEMU tests (all optimize modes)
        run: python3 tools/qemu_test.py

      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-logs
          path: zig-out/qemu-test/*/serial.log
          if-no-files-found: ignore
